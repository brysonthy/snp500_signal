name: S&P 500 Telegram Signal (daily)

on:
  schedule:
    # 21:30 UTC, Mon-Fri (~4:30-5:30pm US Eastern, after market close,
    # depending on daylight saving). Adjust to taste.
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

jobs:
  send-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sp500_signal.py
